# Runs the offline reproduction on every push, so a change that breaks a clone is visible here
# rather than in someone else's checkout. It needs no data download, no GPU and about a minute.
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: every file the package expects is present and its sha256 matches
        run: python scripts/check_assets.py
      - name: every table and offline figure rebuilds from the files in the repository
        run: python scripts/run_smoke_test.py
      - name: regression tests for launchers and array comparison
        run: python -m unittest discover -s tests -v
      - name: every module compiles
        run: python -m compileall -q crndiff evaluation figures toy2d horizon experiments scripts
